<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>รอคิว | DELEF FEST GOPASS</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/app.css"
    >
</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="site-header">

        <div class="wrap nav">

            <!-- Logo -->
            <a
                class="brand"
                href="index.html"
            >
                <img
                    src="images/logo1.png"
                    alt="DELEF FEST"
                >

                <span>
                    DELEF FEST
                    <small>GOPASS</small>
                </span>
            </a>

        </div>

    </header>


    <!-- =========================
         QUEUE
    ========================== -->
    <main class="wrap page narrow">

        <section class="queue-box">

            <!-- Queue Icon -->
            <div class="queue-icon">
                <i class="fa-solid fa-hourglass-half"></i>
            </div>


            <span class="kicker">
                WAITING ROOM
            </span>


            <h1>
                กำลังรอคิว
            </h1>


            <p>
                หมายเลขคิวของคุณ
            </p>


            <!-- Queue Number -->
            <strong id="queueNo">
                #----
            </strong>


            <!-- Queue Stats -->
            <div class="queue-stats">

                <!-- People Ahead -->
                <div>

                    <i class="fa-solid fa-users"></i>

                    <small>
                        คนก่อนหน้า
                    </small>

                    <b id="ahead">
                        ----
                    </b>

                </div>


                <!-- Estimated Time -->
                <div>

                    <i class="fa-solid fa-clock"></i>

                    <small>
                        เวลาประมาณ
                    </small>

                    <b id="wait">
                        -- นาที
                    </b>

                </div>

            </div>


            <!-- Progress -->
            <div class="progress">

                <div id="bar"></div>

            </div>


            <!-- Status -->
            <p id="queueStatus">
                ระบบกำลังจัดคิวให้คุณ
            </p>

        </section>

    </main>


    <!-- =========================
         QUEUE SCRIPT
    ========================== -->
    <script>
        // สร้างหมายเลขคิวแบบ Demo
        const q =
            "#" +
            (Math.floor(Math.random() * 9000) + 1000);

        document.getElementById("queueNo").textContent = q;


        // จำนวนคนก่อนหน้า
        const ahead =
            Math.floor(Math.random() * 900) + 50;

        document.getElementById("ahead").textContent =
            ahead.toLocaleString();


        // เวลารอโดยประมาณ
        const wait =
            Math.floor(Math.random() * 8) + 1;

        document.getElementById("wait").textContent =
            wait + " นาที";


        // Progress Bar
        let p = 0;

        const t = setInterval(() => {

            p += 2.5;

            document.getElementById("bar").style.width =
                p + "%";


            // ครบ 100%
            if (p >= 100) {

                clearInterval(t);

                document.getElementById("queueStatus").textContent =
                    "ถึงคิวแล้ว กำลังเข้าสู่หน้าซื้อบัตร...";


                // ไปหน้าเลือกที่นั่ง
                setTimeout(() => {

                    location.href =
                        "seat.html" + location.search;

                }, 1200);

            }

        }, 300);
    </script>


    <!-- =========================
         CONTACT
    ========================== -->
    <section class="contact-section">

        <div class="contact-title">

            <span>
                CONTACT
            </span>

            <h2>
                ช่องทางการติดต่อ
            </h2>

            <p>
                ติดตามข่าวสารและสอบถามข้อมูลเพิ่มเติม
            </p>

        </div>


        <div class="contact-links">

            <!-- YouTube -->
            <a
                href="#"
                class="contact-item"
            >
                <i class="fa-brands fa-youtube"></i>

                <div>

                    <strong>
                        YouTube
                    </strong>

                    <small>
                        DELEF FEST
                    </small>

                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>

            </a>


            <!-- Instagram -->
            <a
                href="#"
                class="contact-item"
            >
                <i class="fa-brands fa-instagram"></i>

                <div>

                    <strong>
                        Instagram
                    </strong>

                    <small>
                        @deleffest
                    </small>

                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>

            </a>


            <!-- TikTok -->
            <a
                href="#"
                class="contact-item"
            >
                <i class="fa-brands fa-tiktok"></i>

                <div>

                    <strong>
                        TikTok
                    </strong>

                    <small>
                        @deleffest
                    </small>

                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>

            </a>


            <!-- Discord -->
            <a
                href="#"
                class="contact-item"
            >
                <i class="fa-brands fa-discord"></i>

                <div>

                    <strong>
                        Discord
                    </strong>

                    <small>
                        DELEF FEST COMMUNITY
                    </small>

                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>

            </a>

        </div>

    </section>


</body>

</html>
