<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>แดชบอร์ด | Admin</title>
    <link rel="icon" href="../images/logo1.png">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/app.css">
</head>

<body class="admin">

    <!-- =========================
         SIDEBAR
    ========================== -->
    <aside class="sidebar">

        <a class="brand" href="../index.html">
            <img src="../images/logo1.png" alt="DELEF FEST">
            <span>
                DELEF FEST
                <small>GOPASS</small>
            </span>
        </a>

        <a class="side-active" href="dashboard.html">
            <i class="fa-solid fa-chart-line"></i>
            แดชบอร์ด
        </a>

        <a href="events.html">
            <i class="fa-solid fa-calendar-days"></i>
            จัดการคอนเสิร์ต
        </a>

        <a class="soon" title="เร็ว ๆ นี้">
            <i class="fa-solid fa-cart-shopping"></i>
            คำสั่งซื้อ
        </a>

        <a class="soon" title="เร็ว ๆ นี้">
            <i class="fa-solid fa-users"></i>
            ลูกค้า
        </a>

        <div class="side-bottom admin-user">
            <div class="admin-user-chip">
                <i class="fa-solid fa-circle-user"></i>
                <span id="adminUsername">-</span>
            </div>
            <a onclick="adminLogout()" title="ออกจากระบบ">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                ออกจากระบบ
            </a>
        </div>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="admin-main">

        <div class="admin-head">
            <div>
                <span class="kicker">ADMIN</span>
                <h1>แดชบอร์ด</h1>
                <p>ภาพรวมยอดขายและงานคอนเสิร์ตทั้งหมด (ข้อมูลจริงจาก Backend)</p>
            </div>
            <a class="btn red" href="events.html">
                <i class="fa-solid fa-plus"></i>
                เพิ่มงานใหม่
            </a>
        </div>

        <div id="statCards" class="stat-grid"></div>

        <div class="dash-grid">

            <div class="admin-card pad">
                <h2 class="section-title">ยอดขายแยกตามงาน</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Poster</th>
                            <th>งาน</th>
                            <th>บัตรที่ขาย</th>
                            <th>ยอดขาย</th>
                        </tr>
                    </thead>
                    <tbody id="perEventTable"></tbody>
                </table>
            </div>

            <div class="admin-card pad">
                <h2 class="section-title">คำสั่งซื้อล่าสุด</h2>
                <ul id="recentOrders" class="recent-list"></ul>
            </div>

        </div>

    </main>

    <script src="../js/app.js"></script>
    <script>
        initDashboard();
    </script>

</body>

</html>
